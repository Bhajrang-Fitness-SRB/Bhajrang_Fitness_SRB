name: Build Artifacts & Release

on:
  workflow_dispatch:
  push:
    branches: [ Bhajrang-Fitness-SRB ]

jobs:
  build_and_release:
    name: Build artifacts and create release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system deps for WeasyPrint
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2 libpango-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install weasyprint

    - name: Run tests
      run: |
        pytest -q || true

    - name: Generate artifacts (invoices, certificates, flyer, bundle)
      run: |
        mkdir -p build_artifacts
        # Invoice HTML preview (written by billing_invoice_gateway.py)
        python3 _01_Core_Engines/billing_invoice_gateway.py || true
        # Generate invoice PDF via the helper script
        python3 scripts/generate_invoice_pdf.py || true
        # Copy invoice.pdf to artifacts if present
        if [ -f /tmp/invoice.pdf ]; then cp /tmp/invoice.pdf build_artifacts/invoice.pdf; fi
        # Generate a sample certificate PDF
        python3 - <<'PY'
from features.certificates import generate_certificate_pdf
p = generate_certificate_pdf({'name':'CI Demo','id':'CI-001'})
print(p)
PY
        # Move the generated certificate to artifacts if present
        if ls /tmp/certificate_* 1> /dev/null 2>&1; then cp /tmp/certificate_* build_artifacts/ || true; fi
        # Generate promo flyer PDF using weasyprint if available
        python3 - <<'PY'
try:
  from weasyprint import HTML
  HTML('templates/promo_flyer.html').write_pdf('/tmp/promo_flyer.pdf')
  print('/tmp/promo_flyer.pdf')
except Exception as e:
  print('weasyprint flyer generation failed:', e)
PY
        if [ -f /tmp/promo_flyer.pdf ]; then cp /tmp/promo_flyer.pdf build_artifacts/promo_flyer.pdf; fi
        # Build single-install bundle
        chmod +x dist/bundle_app.sh || true
        ./dist/bundle_app.sh || true
        # copy latest bundle zip to artifacts
        if ls dist/*.zip 1> /dev/null 2>&1; then cp $(ls -t dist/*.zip | head -n1) build_artifacts/app_bundle.zip; fi

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: artifacts-${{ github.run_number }}
        release_name: Artifacts - ${{ github.run_number }}
        body: "Automated artifacts: invoice PDF, certificate PDF, promo flyer, and single-install bundle. Generated by CI run ${{ github.run_number }}."
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts to Release
      if: steps.create_release.outputs.upload_url != ''
      run: |
        UPLOAD_URL=${{ steps.create_release.outputs.upload_url }}
        for f in build_artifacts/*; do
          if [ -f "$f" ]; then
            FNAME=$(basename "$f")
            echo "Uploading $f as $FNAME"
            gh api --method POST "$UPLOAD_URL?name=$FNAME" --silent --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" --input "$f"
          fi
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Show artifacts list
      run: ls -lah build_artifacts || true
