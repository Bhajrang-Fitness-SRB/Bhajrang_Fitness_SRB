# Optional: Render "Blueprint". Or create the service by hand (see README.md).
services:
  - type: web
    name: bhajrang-astro-engine
    runtime: docker
    rootDir: astro-engine
    plan: free              # free sleeps after 15 min idle (first call then takes ~1 minute); "starter" stays awake
    healthCheckPath: /health
    envVars:
      - key: ASTRO_ENGINE_KEY
        sync: false          # you type this in the Render dashboard; never commit it
