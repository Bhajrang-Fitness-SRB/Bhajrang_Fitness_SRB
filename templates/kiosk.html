<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔱 Bhajrang AI Kiosk Terminal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <!-- Real-time QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --cyan: #00E5FF;
            --green: #00FF00;
            --red: #FF0000;
            --dark: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--dark);
            color: #FFF;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 🌌 CYBERPUNK BACKGROUND & GRID */
        .kiosk-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111, #000);
            z-index: 0;
        }

        .grid-lines {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            transform: perspective(500px) rotateX(20deg);
            transform-origin: top;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 40px;
            }
        }

        /* 🕰️ TOP HUD HEADER */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 40px;
            right: 40px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }

        .hud-clock {
            font-family: 'Share Tech Mono', monospace;
            font-size: 32px;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .hud-status {
            text-align: right;
        }

        .hud-status span {
            display: block;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 95%;
            max-width: 1300px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            height: 75vh;
            margin-top: 50px;
        }

        /* 📸 LEFT: CAMERA SECTION */
        .cyber-panel {
            background: rgba(5, 5, 5, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(212, 175, 55, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            position: relative;
        }

        /* Sci-Fi Corners */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: var(--cyan);
            border-style: solid;
            transition: 0.3s;
            z-index: 10;
        }

        .tl {
            top: -2px;
            left: -2px;
            border-width: 3px 0 0 3px;
            border-top-left-radius: 20px;
        }

        .tr {
            top: -2px;
            right: -2px;
            border-width: 3px 3px 0 0;
            border-top-right-radius: 20px;
        }

        .bl {
            bottom: -2px;
            left: -2px;
            border-width: 0 0 3px 3px;
            border-bottom-left-radius: 20px;
        }

        .br {
            bottom: -2px;
            right: -2px;
            border-width: 0 3px 3px 0;
            border-bottom-right-radius: 20px;
        }

        #reader {
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(0, 229, 255, 0.3);
            background: #000;
            position: relative;
        }

        /* Laser Animation */
        .scan-laser {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 90%;
            height: 3px;
            background: var(--cyan);
            box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan);
            animation: scan 2s ease-in-out infinite alternate;
            z-index: 10;
            display: none;
            border-radius: 50%;
        }

        @keyframes scan {
            0% {
                top: 10%;
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                top: 90%;
                opacity: 0.5;
            }
        }

        /* Control Buttons */
        .btn-controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            width: 100%;
            justify-content: center;
        }

        .btn-scan {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 15px 25px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            width: 45%;
        }

        .btn-scan:hover,
        .btn-scan.active {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
        }

        .btn-gold-var {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-gold-var:hover,
        .btn-gold-var.active {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* 📊 RIGHT: DISPLAY PANEL SECTION */
        .display-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed #333;
            border-radius: 20px;
            padding: 30px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .status-icon {
            font-size: 80px;
            color: #333;
            margin-bottom: 20px;
            transition: 0.4s;
        }

        .status-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 28px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 2;
            text-align: center;
        }

        /* Dynamic Status Classes */
        .status-granted {
            border-color: var(--green);
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.15), inset 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .status-granted .status-icon {
            color: var(--green);
            filter: drop-shadow(0 0 15px var(--green));
            transform: scale(1.1);
        }

        .status-granted .status-text {
            color: var(--green);
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .status-denied {
            border-color: var(--red);
            background: rgba(255, 0, 0, 0.05);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.15), inset 0 0 20px rgba(255, 0, 0, 0.1);
            animation: shake 0.4s;
        }

        .status-denied .status-icon {
            color: var(--red);
            filter: drop-shadow(0 0 15px var(--red));
            transform: scale(1.1);
        }

        .status-denied .status-text {
            color: var(--red);
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-15px);
            }

            75% {
                transform: translateX(15px);
            }
        }

        /* Profile Image */
        .member-pic {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--green);
            margin-bottom: 15px;
            display: none;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            z-index: 2;
        }

        /* Mini Logs */
        .log-container {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .log-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: var(--gold);
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .log-list {
            list-style: none;
            overflow-y: auto;
            max-height: 120px;
        }

        .log-list::-webkit-scrollbar {
            display: none;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 8px 0;
            border-bottom: 1px dashed #222;
            color: #aaa;
            font-family: 'Share Tech Mono', monospace;
            animation: fadeIn 0.3s;
        }

        .log-item span.success {
            color: var(--green);
        }

        .log-item span.fail {
            color: var(--red);
        }
    </style>
</head>

<body>
    <div class="kiosk-bg"></div>
    <div class="grid-lines"></div>

    <!-- 🕰️ TOP HUD -->
    <div class="hud-header">
        <div>
            <h1
                style="font-family: 'Cinzel', serif; color: var(--gold); margin: 0; font-size: 36px; letter-spacing: 3px; text-shadow: 0 0 15px rgba(212,175,55,0.4);">
                BHAJRANG</h1>
            <p
                style="font-family: 'Share Tech Mono', monospace; color: var(--cyan); font-size: 14px; letter-spacing: 5px; margin: 0;">
                AI SECURITY TERMINAL</p>
        </div>
        <div class="hud-status">
            <div class="hud-clock" id="live-clock">00:00:00</div>
            <span id="live-date">YYYY-MM-DD</span>
            <span style="color: var(--green); margin-top: 5px;">⏺ UPLINK SECURE</span>
        </div>
    </div>

    <div class="container">
        <!-- 📸 LEFT: CAMERA SECTION -->
        <div class="cyber-panel">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div
                style="position: relative; width: 100%; display: flex; justify-content: center; align-items: center; min-height: 350px; background: #000; border-radius: 15px; border: 1px solid #222;">
                <!-- QR Scanner Div -->
                <div id="reader" style="width: 100%;"></div>

                <!-- Face Scanner Simulation Div -->
                <video id="face-video" autoplay playsinline
                    style="display: none; width: 100%; max-width: 450px; border-radius: 15px; transform: scaleX(-1); object-fit: cover;"></video>

                <!-- Laser Overlay -->
                <div class="scan-laser" id="laser"></div>
            </div>

            <div class="btn-controls">
                <button class="btn-scan active" id="btn-qr" onclick="startQRScanner()"><i
                        class="fa-solid fa-qrcode"></i> Scan QR Pass</button>
                <button class="btn-scan btn-gold-var" id="btn-face" onclick="startFaceScan()"><i
                        class="fa-solid fa-face-viewfinder"></i> Biometric</button>
            </div>
        </div>

        <!-- 📊 RIGHT: DISPLAY PANEL SECTION -->
        <div class="display-panel">
            <div class="status-box" id="status-display">
                <i class="fa-solid fa-fingerprint status-icon" id="icon"></i>
                <img id="m-pic" class="member-pic" src="">
                <div class="status-text" id="status-msg">AWAITING TARGET</div>

                <div id="m-name"
                    style="color: #FFF; font-size: 26px; font-weight: 900; margin-top: 15px; display: none; font-family: 'Cinzel', serif; letter-spacing: 1px; z-index: 2;">
                    Warrior Name</div>
                <div id="m-id"
                    style="color: #ccc; font-size: 14px; margin-top: 5px; display: none; font-family: 'Share Tech Mono', monospace; z-index: 2;">
                    ID: RBFXXXX</div>
            </div>

            <!-- Live Action Logs -->
            <div class="log-container">
                <div class="log-title"><i class="fa-solid fa-server"></i> RECENT AUTHENTICATIONS</div>
                <ul class="log-list" id="action-logs">
                    <li class="log-item"><span>System Boot</span> <span style="color: #888;">[OK]</span></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 🧠 SYSTEM LOGIC -->
    <script>
        // --- DOM Elements ---
        const statusBox = document.getElementById('status-display');
        const icon = document.getElementById('icon');
        const statusMsg = document.getElementById('status-msg');
        const mPic = document.getElementById('m-pic');
        const mName = document.getElementById('m-name');
        const mId = document.getElementById('m-id');
        const laser = document.getElementById('laser');
        const logList = document.getElementById('action-logs');
        let html5QrcodeScanner = null;

        // --- 1. Real-Time Clock ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB').replace(/\//g, ' . ');
        }, 1000);

        // --- 2. AI Voice Engine ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0; utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 3. BEEP SOUNDS ---
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);

            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                osc.start(); osc.stop(ctx.currentTime + 0.8);
            }
        }

        // --- 4. QR CODE SCANNER ENGINE ---
        function startQRScanner() {
            document.getElementById('btn-qr').classList.add('active');
            document.getElementById('btn-face').classList.remove('active');
            document.getElementById('face-video').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            laser.style.display = 'block';
            laser.style.background = 'var(--cyan)'; laser.style.boxShadow = '0 0 20px var(--cyan)';
            resetDisplay();

            if (!html5QrcodeScanner) {
                // Configured for fast scanning without UI clutter
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: { width: 250, height: 250 }, showTorchButtonIfSupported: false }, false);
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            }
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if (html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }
            laser.style.display = 'none';
            processAttendance(decodedText, 'QR');
        }
        function onScanFailure(error) { /* Ignore background frame errors */ }

        // --- 5. FACE SCAN ENGINE (Simulation for Frontend HUD) ---
        async function startFaceScan() {
            document.getElementById('btn-face').classList.add('active');
            document.getElementById('btn-qr').classList.remove('active');
            if (html5QrcodeScanner) { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }

            document.getElementById('reader').style.display = 'none';
            laser.style.display = 'block';
            laser.style.background = 'var(--gold)'; laser.style.boxShadow = '0 0 20px var(--gold)';
            resetDisplay();

            const video = document.getElementById('face-video');
            video.style.display = 'block';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;

                statusMsg.innerText = "MAPPING FACIAL STRUCTURE...";
                statusBox.style.borderColor = "var(--gold)";
                icon.className = "fa-solid fa-expand status-icon";
                icon.style.color = "var(--gold)";

                // Simulate processing time
                setTimeout(() => {
                    stream.getTracks().forEach(track => track.stop());
                    video.style.display = 'none';
                    laser.style.display = 'none';
                    // For demo, we trigger attendance for the Admin ID. 
                    processAttendance('RBF29255', 'FACE');
                }, 2500);

            } catch (e) { alert("Camera Error: " + e); }
        }

        // --- 6. ATTENDANCE PROCESSING & CLOUD API CALL ---
        async function processAttendance(memberId, method) {
            statusBox.style.borderColor = "var(--cyan)";
            icon.className = "fa-solid fa-spinner fa-spin status-icon";
            icon.style.color = "var(--cyan)";
            statusMsg.innerText = `VERIFYING VIA CLOUD...`;

            try {
                const res = await fetch('/api/kiosk_scan', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ member_id: memberId, scan_type: method })
                });
                const data = await res.json();

                const timeStr = new Date().toLocaleTimeString('en-US', { hour12: false });

                if (data.status === 'success') {
                    // ✅ ACCESS GRANTED
                    statusBox.className = "status-box status-granted";
                    icon.style.display = "none";
                    mPic.src = data.profile_pic || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                    mPic.style.display = "block";
                    statusMsg.innerText = "ACCESS GRANTED";

                    // The backend now returns names like "Rajib (CHECK-IN)"
                    const cleanName = data.name.split(' (')[0];
                    const action = data.name.includes('OUT') ? 'CHECK-OUT' : 'CHECK-IN';

                    mName.innerText = cleanName; mName.style.display = "block";
                    mId.innerText = `ID: ${data.member_id} | ${action} OK`; mId.style.display = "block";

                    playSound('success');
                    speak(`Access Granted. Welcome, ${cleanName}.`);

                    // Add to Log
                    addLog(`[${timeStr}] ${cleanName} (${data.member_id})`, 'success', action);

                } else {
                    // ❌ ACCESS DENIED
                    statusBox.className = "status-box status-denied";
                    icon.className = "fa-solid fa-skull-crossbones status-icon";
                    mPic.style.display = "none"; icon.style.display = "block";
                    statusMsg.innerText = "ACCESS DENIED";

                    mName.innerText = "UNAUTHORIZED"; mName.style.display = "block";
                    mId.innerText = data.message; mId.style.display = "block";

                    playSound('error');
                    speak("Access Denied. " + data.message);

                    // Add to Log
                    addLog(`[${timeStr}] Unknown ID (${memberId})`, 'fail', 'DENIED');
                }
            } catch (e) {
                statusMsg.innerText = "SYSTEM ERROR";
                speak("Warning. Cloud database offline.");
            }

            // Auto reset HUD after 5 seconds
            setTimeout(() => {
                if (document.getElementById('btn-qr').classList.contains('active')) startQRScanner();
                else resetDisplay();
            }, 5000);
        }

        function resetDisplay() {
            statusBox.className = "status-box";
            statusBox.style.borderColor = "#333";
            icon.className = "fa-solid fa-fingerprint status-icon";
            icon.style.color = "#333";
            icon.style.display = "block"; mPic.style.display = "none";
            statusMsg.innerText = "AWAITING TARGET";
            mName.style.display = "none"; mId.style.display = "none";
        }

        function addLog(text, type, action) {
            const li = document.createElement('li');
            li.className = 'log-item';
            const colorClass = type === 'success' ? 'success' : 'fail';
            li.innerHTML = `<span>${text}</span> <span class="${colorClass}">[${action}]</span>`;
            logList.prepend(li);
            if (logList.children.length > 5) logList.lastChild.remove();
        }

        // Boot System
        window.onload = startQRScanner;
    </script>
</body>

</html>
