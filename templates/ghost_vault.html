<!-- templates/ghost_vault.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Ghost Vault - Secure Login</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        .vault-container { 
            border: 3px solid #ff0000; 
            background: rgba(255,0,0,0.02);
            padding: 24px;
            max-width: 420px;
            margin: 40px auto;
            border-radius: 8px;
        }
        .secure-field { font-family: 'Courier New', monospace; letter-spacing: 5px; padding: 10px; width: 100%; }
        button { padding: 10px 16px; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="vault-container">
        <h2> GHOST VAULT ACCESS</h2>
        <form id="vault-form">
            <input type="text" id="warrior-id" placeholder="WARRIOR ID" class="secure-field" maxlength="16"><br/>
            <input type="password" id="passcode" placeholder="PASSCODE" class="secure-field" maxlength="6"><br/>
            <input type="date" id="dob-auth" style="display:none;">
            <button type="submit">UNLOCK VAULT</button>
        </form>
        <div id="vault-status"></div>
    </div>

    <script>
        document.getElementById('warrior-id').addEventListener('input', (e) => {
            let val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
            if (val.length > 3 && val[3] !== '-' ) {
                val = val.slice(0,3) + '-' + val.slice(3);
            }
            e.target.value = val;
        });

        document.getElementById('vault-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const warrior_id = document.getElementById('warrior-id').value;
            const passcode = document.getElementById('passcode').value;
            const status = document.getElementById('vault-status');
            status.textContent = 'Verifying...';
            try {
                const res = await fetch('/api/validate_vault', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({warrior_id, passcode})});
                const j = await res.json();
                status.textContent = j.valid ? 'Access Granted' : 'Access Denied — check your Warrior ID and Passcode';
            } catch (e) {
                status.textContent = 'Verification failed';
            }
        });
    </script>
</body>
</html>
