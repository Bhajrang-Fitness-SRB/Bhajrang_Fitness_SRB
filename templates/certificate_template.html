# Certificate template
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Certificate</title>
  <style>
    body{font-family:Arial, Helvetica, sans-serif;padding:36px}
    .wrap{border:8px double #333;padding:24px;text-align:center}
    h1{font-size:34px;margin-bottom:8px}
    .stamp{margin-top:24px}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/static/assets/powered_by.png" style="height:64px" alt="logo"/>
    <h1>{{ title }}</h1>
    <p>This certifies that</p>
    <h2>{{ member.name }}</h2>
    <p>has successfully completed the challenge / program</p>
    <div class="stamp">Authorized Signature</div>
    <div style="margin-top:18px">Date: {{ date }}</div>
  </div>
</body>
</html>
