<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Promotion Flyer</title>
  <style>
    body{font-family:Inter, Arial, sans-serif;margin:0;padding:0}
    .flyer{width:800px;height:1200px;background:linear-gradient(180deg,#071126,#0f2540);color:#fff;padding:36px}
    .logo{height:72px}
    .hero{display:flex;align-items:center;gap:24px;margin-top:36px}
    .cta{background:linear-gradient(90deg,#ff4b2b,#ff6f61);padding:12px 20px;border-radius:12px;color:#fff;font-weight:700}
    .list{margin-top:22px}
  </style>
</head>
<body>
  <div class="flyer">
    <img src="/static/assets/logo_gym.png" class="logo" alt="logo"/>
    <div class="hero">
      <div>
        <h1>Join Bhajrang Fitness — Transform Yourself</h1>
        <p>Exclusive offers for new members. Train • Transform • Conquer</p>
        <div class="cta">Sign Up Today</div>
      </div>
      <img src="/static/assets/welcome_animation.png" style="height:220px" alt="hero"/>
    </div>

    <div class="list">
      <h3>Membership Benefits</h3>
      <ul>
        <li>Certified Trainers</li>
        <li>Personalized Nutrition</li>
        <li>Progress Tracking & Rewards</li>
      </ul>
    </div>

    <div style="position:absolute;bottom:36px;left:36px">Visit: <strong>www.example-gym.com</strong></div>
  </div>
</body>
</html>
